name = "net"
version = "0.1.0"
src_dir = "src"
tests = ["tests/spec.gsa"]

[target.native]
c_sources = ["native/gs_tls.c"]

[[target.native.when]]
os = "macos"
c_flags = ["-I/opt/homebrew/opt/openssl@3/include", "-I/usr/local/opt/openssl@3/include"]
link_flags = ["-L/opt/homebrew/opt/openssl@3/lib", "-Wl,-rpath,/opt/homebrew/opt/openssl@3/lib", "-L/usr/local/opt/openssl@3/lib", "-lssl", "-lcrypto"]

[[target.native.when]]
os = "linux"
pkg_config = "openssl"
